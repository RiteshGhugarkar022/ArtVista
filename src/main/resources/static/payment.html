<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ArtVista – Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .glass { background: rgba(15,23,42,0.75); backdrop-filter: blur(18px); border: 1px solid rgba(148,163,184,0.35); }
    .tab-active { background: linear-gradient(135deg,#f472b6,#a855f7); color:#020617; }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#130927] via-[#36104D] to-[#FF4B91] text-slate-100 flex items-center justify-center px-4">

<div class="glass rounded-3xl p-6 md:p-8 w-full max-w-md shadow-2xl">

  <h1 class="text-xl font-semibold mb-1">Payment</h1>
 <!-- <p class="text-xs text-slate-300 mb-5">
    Dummy payment for academic project demonstration.
  </p> -->

  <!-- Art Summary -->
  <div id="summary" class="mb-5 text-sm space-y-1"></div>

  <!-- Payment Tabs -->
  <div class="flex gap-2 mb-5 text-xs">
    <button id="tab-card" class="flex-1 px-3 py-2 rounded-full bg-slate-900/70 border border-slate-600 tab-active">
      Card
    </button>
    <button id="tab-upi" class="flex-1 px-3 py-2 rounded-full bg-slate-900/70 border border-slate-600">
      UPI
    </button>
  </div>

  <!-- Card Payment -->
  <form id="cardForm" class="space-y-4 text-sm">
    <div>
      <label class="block text-slate-300 mb-1">Card Number</label>
      <input required placeholder="4111 1111 1111 1111"
        class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-600 text-slate-100"/>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-slate-300 mb-1">Expiry</label>
        <input required placeholder="MM/YY"
          class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-600 text-slate-100"/>
      </div>
      <div>
        <label class="block text-slate-300 mb-1">CVV</label>
        <input required placeholder="123"
          class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-600 text-slate-100"/>
      </div>
    </div>

    <button type="submit"
      class="w-full mt-3 py-2.5 rounded-xl bg-gradient-to-r from-fuchsia-400 via-violet-400 to-sky-400 text-slate-900 font-semibold shadow-lg shadow-fuchsia-500/40 hover:translate-y-0.5 transition">
      Pay with Card
    </button>
  </form>

  <!-- UPI Payment -->
  <form id="upiForm" class="space-y-4 text-sm hidden">
    <div>
      <label class="block text-slate-300 mb-1">UPI ID</label>
      <input required placeholder="example@upi"
        class="w-full px-3 py-2.5 rounded-xl bg-slate-900/70 border border-slate-600 text-slate-100"/>
    </div>

    <button type="submit"
      class="w-full mt-3 py-2.5 rounded-xl bg-gradient-to-r from-emerald-400 to-green-500 text-slate-900 font-semibold shadow-lg shadow-emerald-500/40 hover:translate-y-0.5 transition">
      Pay with UPI
    </button>

    <!--<p class="text-[11px] text-slate-400 text-center">
      Supported: GPay • PhonePe • Paytm (Demo)
    </p> -->
  </form>

  <p class="text-[11px] text-slate-400 mt-4 text-center">
    After payment, order will be verified by admin.
  </p>

</div>

<script>
const artid = new URLSearchParams(location.search).get('artid');

async function loadSummary(){
  const res = await fetch('/api/arts/' + artid);
  const a = await res.json();
  document.getElementById('summary').innerHTML = `
    <p><span class="text-slate-300">Artwork:</span> <b>${a.artname}</b></p>
    <p><span class="text-slate-300">Price:</span> ₹${a.price}</p>
  `;
}
loadSummary();

// Tabs
const tabCard = document.getElementById('tab-card');
const tabUpi = document.getElementById('tab-upi');
const cardForm = document.getElementById('cardForm');
const upiForm = document.getElementById('upiForm');

tabCard.onclick = () => {
  cardForm.classList.remove('hidden');
  upiForm.classList.add('hidden');
  tabCard.classList.add('tab-active');
  tabUpi.classList.remove('tab-active');
};

tabUpi.onclick = () => {
  upiForm.classList.remove('hidden');
  cardForm.classList.add('hidden');
  tabUpi.classList.add('tab-active');
  tabCard.classList.remove('tab-active');
};

/*
async function placeOrder(){
  await fetch('/api/customer/place-order/' + artid, { method: 'POST' });
  alert('Payment successful! Order placed.');
  window.location.href = '/customer_dashboard.html';
} */

async function placeOrder(){
  const payload = {
    artid: artid,
    customerId: 1
  };

  await fetch('/api/orders', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  alert('Payment successful! Order placed.');
  window.location.href = '/customer_dashboard.html';
}


cardForm.addEventListener('submit', e => {
  e.preventDefault();
  placeOrder();
});

upiForm.addEventListener('submit', e => {
  e.preventDefault();
  placeOrder();
});
</script>
