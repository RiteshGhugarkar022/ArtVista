<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ArtVista – Customer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .glass { background: rgba(15,23,42,0.75); backdrop-filter: blur(18px); border: 1px solid rgba(148,163,184,0.35); }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#130927] via-[#36104D] to-[#FF4B91] text-slate-100">

<!-- Navbar -->
<header class="border-b border-white/10 bg-black/30 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-fuchsia-500 to-violet-500 flex items-center justify-center font-semibold text-xs">AV</div>
      <div>
        <h1 class="text-lg font-semibold">Customer Dashboard</h1>
        <p class="text-[11px] text-slate-300 -mt-0.5">Browse & order artworks</p>
      </div>
    </div>
    <a href="http://localhost:8080/login.html" class="text-xs px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 transition">Logout</a>
  </div>
</header>

<!-- Main -->
<main class="max-w-6xl mx-auto px-4 py-6 space-y-10">

  <!-- Browse Artworks -->
  <section>
    <h2 class="text-lg font-semibold mb-4">Available Paintings</h2>
    <div id="artsGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <!-- Order History -->
  <section>
    <h2 class="text-lg font-semibold mb-4">My Orders</h2>
    <div id="orderHistory" class="space-y-4"></div>
  </section>

</main>

<script>
async function loadArts(){
  const res = await fetch('/api/arts/verified-arts');
  const data = await res.json();
  const grid = document.getElementById('artsGrid');

  if(!data || data.length === 0){
    grid.innerHTML = '<p class="text-slate-400 text-sm">No artworks available right now.</p>';
    return;
  }

  data.forEach(a => {
    grid.insertAdjacentHTML('beforeend', `
      <div class="glass rounded-3xl overflow-hidden">
        <img src="/images/${a.imagepath}" class="h-44 w-full object-cover"/>
        <div class="p-4 space-y-2">
          <h3 class="font-semibold">${a.artname}</h3>
          <p class="text-xs text-slate-300">₹${a.price}</p>
          <a href="/art_details.html?id=${a.artid}" class="block text-center px-3 py-2 rounded-xl bg-gradient-to-r from-fuchsia-400 to-violet-400 text-slate-900 text-xs font-semibold mt-2">
            Order Now
          </a>
        </div>
      </div>
    `);
  });
}

    });

async function loadOrders(){
  const res = await fetch('/api/orders');
  const data = await res.json();
  const box = document.getElementById('orderHistory');

  if(!data || data.length === 0){
    box.innerHTML = '<p class="text-slate-400 text-sm">You have not placed any orders yet.</p>';
    return;
  }

  data.forEach(o => {
    box.insertAdjacentHTML('beforeend', `
      <div class="glass rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="font-semibold text-sm">Order #${o.orderid}</p>
          <p class="text-xs text-slate-300">Artwork: ${o.artname}</p>
        </div>
        <span class="text-xs px-3 py-1 rounded-full bg-slate-800">${o.status}</span>
      </div>
    `);
  });
}

loadArts();
loadOrders();
</script>

</body>
</html>
