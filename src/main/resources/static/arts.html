<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ArtVista – Artwork Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .glass { background: rgba(15,23,42,0.75); backdrop-filter: blur(18px); border: 1px solid rgba(148,163,184,0.35); }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#130927] via-[#36104D] to-[#FF4B91] text-slate-100">

<!-- Navbar -->
<header class="border-b border-white/10 bg-black/30 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-fuchsia-500 to-violet-500 flex items-center justify-center font-semibold text-xs">AV</div>
      <div>
        <h1 class="text-lg font-semibold">Artwork Details</h1>
        <p class="text-[11px] text-slate-300 -mt-0.5">Verified artwork</p>
      </div>
    </div>
    <a href="/index.html" class="text-xs px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 transition">Back to Home</a>
  </div>
</header>

<!-- Main -->
<main class="max-w-6xl mx-auto px-4 py-8">
  <div id="artBox" class="glass rounded-3xl p-6 grid md:grid-cols-2 gap-6"></div>
</main>

<script>
const id = new URLSearchParams(location.search).get('id');

async function loadArt(){
  const res = await fetch('/api/arts/verified-arts' + id);
  const a = await res.json();
  const box = document.getElementById('artBox');

  box.innerHTML = `
    <img src="/images/${a.imagepath}" class="rounded-3xl w-full h-80 object-cover"/>

    <div class="space-y-4">
      <h2 class="text-2xl font-semibold">${a.artname}</h2>
      <p class="text-sm text-slate-300">
        This is an original painting uploaded by a verified artist on ArtVista.
        All artworks are reviewed by admin before publishing.
      </p>

      <div class="flex items-center gap-4">
        <span class="text-2xl font-bold text-fuchsia-300">₹${a.price}</span>
        <span class="text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300">
          Verified
        </span>
      </div>

      <!-- Optional Order -->
      <div class="pt-4">
        <a href="/payment.html?artId=${a.artid}" 
           class="inline-block px-6 py-2.5 rounded-xl bg-gradient-to-r from-fuchsia-400 via-violet-400 to-sky-400 text-slate-900 font-semibold shadow-lg shadow-fuchsia-500/40 hover:translate-y-0.5 transition">
          Order Now
        </a>
        <p class="text-[11px] text-slate-400 mt-2">
          Note: You can also order directly from the gallery page.
        </p>
      </div>
    </div>
  `;
}

loadArt();
</script>
</body>
</html>
