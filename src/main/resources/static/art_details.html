<button onclick="buy()">Buy</button>

<script>
const id = new URLSearchParams(location.search).get("id");

async function buy() {
  const payload = {
    artid: id,
    customerId: 2
  };


async function load() {
  const a = await fetch('/api/arts/' + id).then(r => r.json());
  const artist = await fetch('/api/artist/' + a.artistId).then(r => r.json());
  
  document.getElementById('box').innerHTML = `
    <img src="/images/${a.imagepath}" width="300">
    <h2>${a.artname}</h2>
    <p>Price: ₹${a.price}</p>

    <h3>Artist Details</h3>
    <p>
      Name: ${artist.artistName}<br>
      Email: ${artist.artistemail}<br>
      Phone: ${artist.artistphone}
    </p>
  `;
  }

  const res = await fetch('/api/orders/place', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });

  const order = await res.json();
  location.href = `/payment.html?artid=${id}`;

}

load();
</script>
