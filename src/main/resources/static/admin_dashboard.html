<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ArtVista – Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .glass { background: rgba(15,23,42,0.75); backdrop-filter: blur(18px); border: 1px solid rgba(148,163,184,0.35); }
  </style>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#130927] via-[#36104D] to-[#FF4B91] text-slate-100">

<!-- Navbar -->
<header class="border-b border-white/10 bg-black/30 backdrop-blur">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-fuchsia-500 to-violet-500 flex items-center justify-center font-semibold text-xs">AV</div>
      <div>
        <h1 class="text-lg font-semibold">Admin Dashboard</h1>
        <p class="text-[11px] text-slate-300 -mt-0.5">Art & Order Verification</p>
      </div>
    </div>
    <a href="http://localhost:8080/login.html" class="text-xs px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 transition">Logout</a>
  </div>
</header>

<!-- Main -->
<main class="max-w-6xl mx-auto px-4 py-6 space-y-8">

  <!-- Stats -->
  <section class="grid sm:grid-cols-3 gap-4">
    <div class="glass rounded-3xl p-4 text-center">
      <p class="text-2xl font-semibold text-amber-300">Pending</p>
      <p class="text-xs text-slate-300">Artworks to Verify</p>
    </div>
    <div class="glass rounded-3xl p-4 text-center">
      <p class="text-2xl font-semibold text-sky-300">Orders</p>
      <p class="text-xs text-slate-300">Pending Orders</p>
    </div>
    <div class="glass rounded-3xl p-4 text-center">
      <p class="text-2xl font-semibold text-emerald-300">Approved</p>
      <p class="text-xs text-slate-300">Live Paintings</p>
    </div>
  </section>

  <!-- Pending Artworks -->
  <section>
    <h2 class="text-lg font-semibold mb-3">Pending Artwork Verification</h2>
    <div id="pendingArts" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>

  <!-- Pending Orders -->
  <section>
    <h2 class="text-lg font-semibold mb-3">Pending Order Verification</h2>
    <div id="pendingOrders" class="space-y-4"></div>
  </section>

</main>

<script>
async function loadPendingArts(){
  const res = await fetch('/api/admin/pending-arts');
  const data = await res.json();
  const box = document.getElementById('pendingArts');

  if(!data || data.length === 0){
    box.innerHTML = '<p class="text-slate-400 text-sm">No artworks pending verification.</p>';
    return;
  }

  data.forEach(a => {
    box.insertAdjacentHTML('beforeend', `
      <div class="glass rounded-3xl overflow-hidden">
        <img src="/images/${a.imagepath}" class="h-44 w-full object-cover"/>
        <div class="p-4 space-y-2">
          <h3 class="font-semibold">${a.artname}</h3>
          <p class="text-xs text-slate-300">Price: ₹${a.price}</p>
          <div class="flex gap-2 pt-2">
            <button onclick="verifyArt(${a.artid})" class="flex-1 px-3 py-2 rounded-xl bg-gradient-to-r from-emerald-400 to-green-500 text-slate-900 text-xs font-semibold">
              Verify
            </button>
            <button onclick="rejectArt(${a.artid})" class="flex-1 px-3 py-2 rounded-xl bg-red-500/80 hover:bg-red-500 text-xs font-semibold">
              Reject
            </button>
          </div>
        </div>
      </div>
    `);
  });
}

async function loadPendingOrders(){
  const res = await fetch('/api/orders/pending-admin');
  const data = await res.json();
  const box = document.getElementById('pendingOrders');

  if(!data || data.length === 0){
    box.innerHTML = '<p class="text-slate-400 text-sm">No orders pending verification.</p>';
    return;
  }

  data.forEach(o => {
    box.insertAdjacentHTML('beforeend', `
      <div class="glass rounded-2xl p-4 flex justify-between items-center">
        <div>
          <p class="font-semibold text-sm">Order #${o.orderid}</p>
          <p class="text-xs text-slate-300">Artwork: ${o.artname}</p>
        </div>
        <button onclick="verifyOrder(${o.orderid})" class="px-4 py-2 rounded-xl bg-gradient-to-r from-fuchsia-400 to-violet-400 text-slate-900 text-xs font-semibold">
          Verify Order
        </button>
      </div>
    `);
  });
}

function verifyArt(id){
  fetch(`/api/admin/verify-art/${id}`, { method: 'POST' })
    .then(() => location.reload());
}

/*function verifyOrder(id){
  fetch(`/api/admin/verify-order/${id}`, { method: 'POST' })
    .then(() => location.reload());
}

function rejectArt(id) {
  fetch(`/api/admin/art/${id}/reject`, { method: "PUT" })
    .then(() => location.reload());
}

function rejectArt(id) {
  fetch('/api/admin/art/reject/' + id, { method: 'POST' })
    .then(() => location.reload());
}
*/

function rejectArt(id){
    fetch(`/api/admin/reject-art/${id}`, { method: 'POST' })
        .then(() => location.reload());
}

function verifyOrder(id) {
    fetch(`/api/orders/${id}/verify`, { method: 'PUT' })
        .then(() => location.reload());
}

function rejectOrder(id) {
    fetch(`/api/orders/${id}/reject`, { method: 'PUT' })
        .then(() => location.reload());
}


loadPendingArts();
loadPendingOrders();
</script>

</body>
</html>
